{% if messages %}
    <div class="toast-stack" aria-live="polite" aria-relevant="additions">
        {% for message in messages %}
            <div class="toast toast-{{ message.tags }}"
                 role="{% if 'error' in message.tags %}alert{% else %}status{% endif %}"
                 data-notification>
                <span class="toast-text">{{ message }}</span>
                <button class="toast-close" type="button" aria-label="Fermer la notification" data-notification-close>
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
